name: gtavigalaxy
description: GTAVI Galaxy - GTA 6 news, trailers, characters and launch countdown.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_widget_from_html_core: ^0.17.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  flutter_avif: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E0E16"
